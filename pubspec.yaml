name: shop_ease
description: "ShopEase - offline-first shopping app built with Flutter + Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # State, storage, connectivity
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^7.3.1

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/

# App icon. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3949AB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 23
